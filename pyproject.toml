[project]
name = "linewerk"
version = "0.1.0"
description = "Streaming + batch lakehouse on Bosch production line data with Delta Lake and PySpark"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "delta-spark==4.3.1",
    "pyspark==4.1.1",
]

[dependency-groups]
dev = [
    "kaggle>=2.2.5",
    "pytest",
    "ruff",
    "six>=1.17.0", # kaggle CLI imports six without declaring it
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linewerk"]
